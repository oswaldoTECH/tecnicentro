<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>Admin · Brothers Pizza</title>

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Bebas+Neue&display=swap" rel="stylesheet">

<style>
  :root { --bp-accent:#ff4757; --bp-success:#2ed573; --bp-gold:#ffa502; }
  * { -webkit-tap-highlight-color: transparent; }
  body { background:#0a0a0f; color:#f3f4f6; font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  .font-display { font-family:'Bebas Neue',sans-serif; letter-spacing:.02em; }

  ::-webkit-scrollbar { width:8px; }
  ::-webkit-scrollbar-track { background:#12121c; }
  ::-webkit-scrollbar-thumb { background:#374151; border-radius:999px; }

  .card { background:#12121c; border:1px solid rgba(255,255,255,.08); border-radius:1.5rem; }
  .input, .select, .textarea {
    width:100%; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.1);
    border-radius:.85rem; padding:.7rem .9rem; font-size:.85rem; color:#fff;
    transition:border-color .25s, box-shadow .25s;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline:none; border-color:var(--bp-accent);
    box-shadow:0 0 0 3px rgba(255,71,87,.15);
  }
  .label { font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:#9ca3af; margin-bottom:.4rem; display:block; }

  .btn-primary {
    background:linear-gradient(135deg,#ff4757,#ff6b35); color:#fff;
    font-weight:800; padding:.75rem 1.25rem; border-radius:.85rem;
    box-shadow:0 8px 20px -8px rgba(255,71,87,.6);
    transition:transform .2s, box-shadow .2s; cursor:pointer; border:none;
  }
  .btn-primary:hover { transform:translateY(-2px); }
  .btn-primary:active { transform:scale(.97); }

  .btn-ghost {
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
    color:#fff; font-weight:700; padding:.65rem 1.1rem; border-radius:.85rem;
    cursor:pointer; transition:background .2s;
  }
  .btn-ghost:hover { background:rgba(255,255,255,.1); }

  .btn-danger {
    background:rgba(255,71,87,.15); border:1px solid rgba(255,71,87,.4);
    color:#ff8a94; font-weight:700; padding:.5rem .85rem; border-radius:.7rem;
    cursor:pointer; transition:background .2s; font-size:.75rem;
  }
  .btn-danger:hover { background:rgba(255,71,87,.28); }

  .toast {
    position:fixed; bottom:20px; right:20px; z-index:100;
    background:#12121c; border:1px solid rgba(46,213,115,.4);
    padding:.85rem 1.1rem; border-radius:1rem; font-size:.8rem;
    font-weight:700; box-shadow:0 20px 40px -10px rgba(0,0,0,.7);
    transform:translateX(120%); transition:transform .4s cubic-bezier(.22,1,.36,1);
    display:flex; align-items:center; gap:.6rem; max-width:90vw;
  }
  .toast.show { transform:translateX(0); }
  .toast.error { border-color:rgba(255,71,87,.5); color:#ff8a94; }

  .login-bg {
    background:
      radial-gradient(ellipse at top, rgba(255,71,87,.28), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(255,165,2,.2), transparent 50%),
      #0a0a0f;
  }

  @keyframes float-y { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .float { animation:float-y 3.5s ease-in-out infinite; }
</style>
</head>
<body class="min-h-screen">

<!-- ================= LOGIN ================= -->
<div id="loginView" class="login-bg min-h-screen grid place-items-center p-5">
  <div class="card p-8 w-full max-w-sm text-center">
    <div class="w-16 h-16 mx-auto rounded-2xl bg-gradient-to-br from-[#ff4757] to-[#ff6b35] grid place-items-center text-white text-2xl mb-4 float">
      <i class="fa-solid fa-pizza-slice"></i>
    </div>
    <h1 class="font-display text-3xl mb-1">PANEL ADMIN</h1>
    <p class="text-xs text-gray-500 mb-6">Brothers Pizza · Biblián</p>

    <div class="text-left space-y-3">
      <div>
        <label class="label">Usuario</label>
        <input id="loginUser" type="text" class="input" autocomplete="username" placeholder="admin">
      </div>
      <div>
        <label class="label">Contraseña</label>
        <input id="loginPass" type="password" class="input" autocomplete="current-password" placeholder="••••••">
      </div>
      <button id="loginBtn" class="btn-primary w-full mt-2">
        <i class="fa-solid fa-right-to-bracket mr-1"></i> Ingresar
      </button>
      <p class="text-[10px] text-gray-600 text-center pt-2">
        Demo: <span class="text-[#ffa502] font-bold">admin</span> / <span class="text-[#ffa502] font-bold">brothers2024</span>
      </p>
    </div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="adminView" class="hidden min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#0a0a0f]/95 backdrop-blur-lg border-b border-white/10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#ff4757] to-[#ff6b35] grid place-items-center text-white">
          <i class="fa-solid fa-pizza-slice"></i>
        </div>
        <div>
          <h1 class="font-display text-xl leading-none">ADMIN · BROTHERS PIZZA</h1>
          <p class="text-[10px] text-gray-500 mt-1">Edita el menú · Se sincroniza en vivo</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="btn-ghost text-xs hidden sm:inline-flex items-center gap-2">
          <i class="fa-solid fa-eye"></i> Ver tienda
        </a>
        <button id="logoutBtn" class="btn-ghost text-xs">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- Tamaños -->
    <section class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-display text-2xl">TAMAÑOS</h2>
          <p class="text-[11px] text-gray-500">Configuración de tamaños, porciones y precio</p>
        </div>
        <button id="addSizeBtn" class="btn-primary text-xs">
          <i class="fa-solid fa-plus mr-1"></i> Añadir
        </button>
      </div>
      <div id="sizesList" class="space-y-3"></div>
    </section>

    <!-- Pizzas -->
    <section class="card p-5">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="font-display text-2xl">PIZZAS</h2>
          <p class="text-[11px] text-gray-500">Nombre, descripción y etiqueta</p>
        </div>
        <button id="addPizzaBtn" class="btn-primary text-xs">
          <i class="fa-solid fa-plus mr-1"></i> Añadir
        </button>
      </div>
      <div id="pizzasList" class="space-y-3"></div>
    </section>

    <!-- Extras -->
    <section class="card p-5">
      <h2 class="font-display text-2xl mb-4">EXTRAS</h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <div>
          <label class="label">Precio porción individual</label>
          <input id="porcionPrecio" type="number" step="0.01" class="input">
        </div>
        <div>
          <label class="label">Precio cola 1L</label>
          <input id="colaPrecio" type="number" step="0.01" class="input">
        </div>
      </div>
    </section>

    <!-- Acciones -->
    <div class="flex flex-col sm:flex-row gap-3 pb-8">
      <button id="saveBtn" class="btn-primary flex-1 py-4 text-base">
        <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar cambios
      </button>
      <button id="resetBtn" class="btn-ghost flex-1 py-4 text-base text-red-400">
        <i class="fa-solid fa-rotate-left mr-2"></i> Restaurar por defecto
      </button>
    </div>
  </main>
</div>

<!-- ================= TOAST ================= -->
<div id="toast" class="toast">
  <i class="fa-solid fa-circle-check text-[#2ed573]"></i>
  <span id="toastMsg">Listo</span>
</div>

<script>
// ==================== CONFIG ====================
const CREDENCIALES = { user: "admin", pass: "brothers2024" };
const STORAGE_KEY = "bp_menu";
const SESSION_KEY = "bp_admin_session";

const DEF_MENU = {
  tamanos: [
    { id:"personal", label:"Personal", precio:5, porciones:4 },
    { id:"mediana", label:"Mediana", precio:9, porciones:10 },
    { id:"familiar", label:"Familiar", precio:13, porciones:12 }
  ],
  pizzas: [
    { id:1, nombre:"Pizza Pepperoni", desc:"Pepperoni y mozzarella", badge:"hot" },
    { id:2, nombre:"Pizza Margarita", desc:"Mozzarella, albahaca y tomate" },
    { id:3, nombre:"Pizza Hawaiana", desc:"Jamón, piña y mozzarella" },
    { id:4, nombre:"Pizza de Jamón", desc:"Jamón y mozzarella", badge:"new" }
  ],
  porcion: { id:200, nombre:"Porción de Pizza", precio:1.25 },
  cola: { id:300, nombre:"Cola 1L", precio:0.75 }
};

// ==================== HELPERS ====================
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => "$" + Number(v).toFixed(2);

function cargarMenu() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const m = JSON.parse(raw);
      if (m && Array.isArray(m.pizzas) && Array.isArray(m.tamanos) && m.porcion && m.cola) return m;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEF_MENU));
}

function guardarMenu(menu) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(menu));
  // El evento 'storage' se dispara automáticamente en otras pestañas.
}

let MENU = cargarMenu();

// ==================== TOAST ====================
let toastTimer;
function toast(msg, isError = false) {
  const el = $("#toast");
  const icon = el.querySelector("i");
  $("#toastMsg").textContent = msg;
  icon.className = isError
    ? "fa-solid fa-circle-exclamation text-[#ff4757]"
    : "fa-solid fa-circle-check text-[#2ed573]";
  el.classList.toggle("error", isError);
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2400);
}

// ==================== LOGIN ====================
function initLogin() {
  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    mostrarAdmin();
    return;
  }
  $("#loginBtn").addEventListener("click", tryLogin);
  $("#loginPass").addEventListener("keydown", e => { if (e.key === "Enter") tryLogin(); });
  $("#loginUser").addEventListener("keydown", e => { if (e.key === "Enter") $("#loginPass").focus(); });
}
function tryLogin() {
  const u = $("#loginUser").value.trim();
  const p = $("#loginPass").value;
  if (u === CREDENCIALES.user && p === CREDENCIALES.pass) {
    sessionStorage.setItem(SESSION_KEY, "1");
    mostrarAdmin();
    toast("Bienvenido 👋");
  } else {
    toast("Credenciales incorrectas", true);
    $("#loginPass").value = "";
    $("#loginPass").focus();
  }
}
function mostrarAdmin() {
  $("#loginView").classList.add("hidden");
  $("#adminView").classList.remove("hidden");
  renderTodo();
}
function logout() {
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

// ==================== RENDER ====================
function renderTodo() {
  renderSizes();
  renderPizzas();
  $("#porcionPrecio").value = MENU.porcion.precio;
  $("#colaPrecio").value = MENU.cola.precio;
}

function renderSizes() {
  const cont = $("#sizesList");
  if (!MENU.tamanos.length) {
    cont.innerHTML = `<p class="text-center text-gray-500 py-4 text-sm">Sin tamaños</p>`;
    return;
  }
  cont.innerHTML = MENU.tamanos.map((t, i) => `
    <div class="bg-black/30 border border-white/8 rounded-2xl p-4 grid grid-cols-1 sm:grid-cols-[1fr,1fr,1fr,auto] gap-3 items-end" data-idx="${i}">
      <div>
        <label class="label">Nombre</label>
        <input class="input" data-field="label" value="${esc(t.label)}">
      </div>
      <div>
        <label class="label">Precio ($)</label>
        <input class="input" type="number" step="0.01" data-field="precio" value="${t.precio}">
      </div>
      <div>
        <label class="label">Porciones</label>
        <input class="input" type="number" data-field="porciones" value="${t.porciones}">
      </div>
      <button class="btn-danger h-fit" data-remove="size" data-idx="${i}">
        <i class="fa-solid fa-trash"></i>
      </button>
    </div>
  `).join("");

  $$("[data-remove='size']", cont).forEach(b => b.addEventListener("click", () => {
    MENU.tamanos.splice(Number(b.dataset.idx), 1);
    renderSizes();
  }));
}

function renderPizzas() {
  const cont = $("#pizzasList");
  if (!MENU.pizzas.length) {
    cont.innerHTML = `<p class="text-center text-gray-500 py-4 text-sm">Sin pizzas</p>`;
    return;
  }
  cont.innerHTML = MENU.pizzas.map((p, i) => `
    <div class="bg-black/30 border border-white/8 rounded-2xl p-4 space-y-3" data-idx="${i}">
      <div class="flex items-start gap-3">
        <div class="flex-1 space-y-3">
          <div>
            <label class="label">Nombre</label>
            <input class="input" data-field="nombre" value="${esc(p.nombre)}">
          </div>
          <div>
            <label class="label">Descripción</label>
            <input class="input" data-field="desc" value="${esc(p.desc || "")}">
          </div>
          <div>
            <label class="label">Etiqueta</label>
            <select class="select" data-field="badge">
              <option value="" ${!p.badge ? "selected" : ""}>Sin etiqueta</option>
              <option value="hot" ${p.badge === "hot" ? "selected" : ""}>🔥 Popular</option>
              <option value="new" ${p.badge === "new" ? "selected" : ""}>⭐ Nuevo</option>
            </select>
          </div>
        </div>
        <button class="btn-danger h-fit shrink-0" data-remove="pizza" data-idx="${i}">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>
  `).join("");

  $$("[data-remove='pizza']", cont).forEach(b => b.addEventListener("click", () => {
    MENU.pizzas.splice(Number(b.dataset.idx), 1);
    renderPizzas();
  }));
}

// ==================== RECOLECTAR DATOS ====================
function recolectar() {
  // Tamaños
  $$("#sizesList > div").forEach(el => {
    const i = Number(el.dataset.idx);
    MENU.tamanos[i] = {
      id: MENU.tamanos[i]?.id || ("t" + Date.now()),
      label: el.querySelector("[data-field='label']").value.trim() || "Tamaño",
      precio: parseFloat(el.querySelector("[data-field='precio']").value) || 0,
      porciones: parseInt(el.querySelector("[data-field='porciones']").value, 10) || 1
    };
  });
  // Pizzas
  $$("#pizzasList > div").forEach(el => {
    const i = Number(el.dataset.idx);
    MENU.pizzas[i] = {
      id: MENU.pizzas[i]?.id || (Date.now() + i),
      nombre: el.querySelector("[data-field='nombre']").value.trim() || "Pizza",
      desc: el.querySelector("[data-field='desc']").value.trim(),
      badge: el.querySelector("[data-field='badge']").value || undefined
    };
  });
  // Extras
  MENU.porcion.precio = parseFloat($("#porcionPrecio").value) || 0;
  MENU.cola.precio = parseFloat($("#colaPrecio").value) || 0;
}

// ==================== ACCIONES ====================
function guardar() {
  recolectar();
  if (!MENU.tamanos.length) { toast("Debe haber al menos un tamaño", true); return; }
  if (!MENU.pizzas.length) { toast("Debe haber al menos una pizza", true); return; }
  guardarMenu(MENU);
  toast("Cambios guardados ✅");
}

function reset() {
  if (!confirm("¿Restaurar el menú por defecto? Se perderán los cambios actuales.")) return;
  MENU = JSON.parse(JSON.stringify(DEF_MENU));
  guardarMenu(MENU);
  renderTodo();
  toast("Menú restaurado");
}

// ==================== INIT ====================
$("#addSizeBtn").addEventListener("click", () => {
  MENU.tamanos.push({ id: "t" + Date.now(), label: "Nuevo", precio: 0, porciones: 1 });
  renderSizes();
});
$("#addPizzaBtn").addEventListener("click", () => {
  MENU.pizzas.push({ id: Date.now(), nombre: "Nueva Pizza", desc: "" });
  renderPizzas();
});
$("#saveBtn").addEventListener("click", guardar);
$("#resetBtn").addEventListener("click", reset);
$("#logoutBtn").addEventListener("click", logout);

initLogin();
</script>
</body>
</html>
